services:
  dashboard:
    build: .
    image: oliver-dashboard:local
    container_name: oliver-dashboard
    restart: unless-stopped
    environment:
      DASHBOARD_BIND: 0.0.0.0:3000
      DASHBOARD_DATABASE_URL: sqlite:///data/dashboard.sqlite?mode=rwc
      DASHBOARD_RP_ID: dash.marcusson.dev
      DASHBOARD_ORIGIN: https://dash.marcusson.dev
      DASHBOARD_AGENT_URL: http://host.docker.internal:13001
      DASHBOARD_AGENT_TOKEN_FILE: /run/secrets/dashboard-agent-token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dashboard-data:/data
      - /var/lib/oliver-dashboard/agent-token:/run/secrets/dashboard-agent-token:ro
    ports:
      - "127.0.0.1:13000:3000"
    networks:
      - dashboard
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional standalone Caddy for hosts that do not already run Caddy.
  # This profile is disabled by default because this server already has host Caddy on :80/:443.
  caddy:
    profiles: ["standalone-caddy"]
    image: caddy:2-alpine
    container_name: oliver-dashboard-caddy
    restart: unless-stopped
    depends_on:
      - dashboard
    ports:
      - "443:443"
      - "80:80"
    environment:
      DASHBOARD_DOMAIN: dash.marcusson.dev
      # CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./deploy/Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - dashboard

volumes:
  dashboard-data:
  caddy-data:
  caddy-config:

networks:
  dashboard:
    driver: bridge
